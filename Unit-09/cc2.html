<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Button Example</title>
</head>
<body>

    <h1 id="greeting">Hello World!</h1>

    <button onclick="changeText()">Click here</button>

    <script>
        function changeText() {
            document.getElementById("greeting").innerHTML = ":)";
        }
    </script>

</body>
</html>
